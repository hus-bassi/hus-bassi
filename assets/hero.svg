<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .star-twinkle {
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    .star-twinkle-delayed {
      animation: twinkle 5s ease-in-out 2s infinite alternate;
    }
    .orbit-spin {
      transform-origin: 470px 180px;
      animation: rotateOrbit 40s linear infinite;
    }
    .beacon-pulse {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 4px;
    }
    .text-mono {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, Menlo, Monaco, monospace;
    }
    .text-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Deep Void Background -->
  <rect width="940" height="360" rx="16" fill="url(#bgGrad)" stroke="#c5a059" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Celestial Grid & Reticles -->
  <g stroke="#c5a059" stroke-opacity="0.07" stroke-width="0.8">
    <line x1="40" y1="40" x2="900" y2="40"/>
    <line x1="40" y1="320" x2="900" y2="320"/>
    <line x1="40" y1="40" x2="40" y2="320"/>
    <line x1="900" y1="40" x2="900" y2="320"/>
    <line x1="470" y1="40" x2="470" y2="320" stroke-dasharray="4 6"/>
  </g>

  <!-- Technical Corner Marks -->
  <g stroke="#dfc790" stroke-width="1.5" stroke-opacity="0.5">
    <!-- Top-Left -->
    <path d="M 32 46 L 32 32 L 46 32"/>
    <!-- Top-Right -->
    <path d="M 908 46 L 908 32 L 894 32"/>
    <!-- Bottom-Left -->
    <path d="M 32 314 L 32 328 L 46 328"/>
    <!-- Bottom-Right -->
    <path d="M 908 314 L 908 328 L 894 328"/>
  </g>

  <!-- Starfield (Twinkling Constellations) -->
  <g fill="#dfc790">
    <circle cx="95" cy="85" r="1" class="star-twinkle"/>
    <circle cx="160" cy="140" r="1.5" class="star-twinkle-delayed"/>
    <circle cx="240" cy="70" r="1.2" class="star-twinkle"/>
    <circle cx="310" cy="110" r="0.8" opacity="0.4"/>
    <circle cx="780" cy="80" r="1.2" class="star-twinkle"/>
    <circle cx="840" cy="130" r="1.5" class="star-twinkle-delayed"/>
    <circle cx="720" cy="160" r="1" class="star-twinkle"/>
    <circle cx="810" cy="280" r="1.4" class="star-twinkle"/>
    <circle cx="120" cy="260" r="1.2" class="star-twinkle-delayed"/>
    <circle cx="210" cy="300" r="0.9" opacity="0.5"/>
    <circle cx="470" cy="65" r="1.2" class="star-twinkle"/>
  </g>

  <!-- Astro Orbital Geometry -->
  <g class="orbit-spin" stroke="#c5a059" stroke-opacity="0.18" fill="none" stroke-width="1">
    <ellipse cx="470" cy="180" rx="420" ry="120" stroke-dasharray="12 18"/>
    <ellipse cx="470" cy="180" rx="280" ry="80" stroke-dasharray="6 12" stroke-opacity="0.12"/>
    <!-- Orbital Nodes -->
    <circle cx="890" cy="180" r="3" fill="#dfc790" opacity="0.6"/>
    <circle cx="50" cy="180" r="2.5" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Central Glow Horizon -->
  <ellipse cx="470" cy="180" rx="300" ry="90" fill="#081e28" opacity="0.6" filter="url(#glow)"/>

  <!-- Content Elements -->

  <!-- Top Badge: Astroinformatics & Applied Informatics -->
  <g transform="translate(470, 75)">
    <rect x="-195" y="-14" width="390" height="28" rx="14" fill="#05141c" stroke="#c5a059" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="-172" cy="0" r="3" fill="#38bdf8" class="beacon-pulse"/>
    <text x="-158" y="4" class="text-mono" font-size="11" fill="#dfc790" letter-spacing="1.2">
      ✦ 09.03.03 APPLIED INFORMATICS • ASTROINFORMATICS
    </text>
  </g>

  <!-- Main Headline: HUSSEIN ELBASSIOUNI -->
  <text x="470" y="145" text-anchor="middle" class="text-title" font-size="34" fill="url(#goldGrad)" filter="url(#subtleGlow)">
    HUSSEIN ELBASSIOUNI
  </text>

  <!-- Subtitle: Professional Positioning & Mission -->
  <text x="470" y="182" text-anchor="middle" class="text-sans" font-size="15" fill="#f5f8f7" font-weight="500" letter-spacing="0.5">
    Data Analyst &amp; Software Engineer  •  Future Space &amp; Astroinformatics Researcher
  </text>

  <!-- Path from Egypt to Russia -->
  <g transform="translate(470, 218)">
    <line x1="-180" y1="0" x2="-35" y2="0" stroke="#c5a059" stroke-width="1" stroke-opacity="0.3"/>
    <text x="-190" y="4" text-anchor="end" class="text-mono" font-size="11" fill="#849e97">GIZA, EGYPT</text>
    
    <circle cx="0" cy="0" r="4" fill="#dfc790" filter="url(#subtleGlow)"/>
    <polygon points="0,-7 3,0 0,7 -3,0" fill="#dfc790"/>
    
    <line x1="35" y1="0" x2="180" y2="0" stroke="#c5a059" stroke-width="1" stroke-opacity="0.3"/>
    <text x="190" y="4" text-anchor="start" class="text-mono" font-size="11" fill="#dfc790">MOSCOW, RUSSIA</text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(470, 275)" text-anchor="middle">
    <!-- Chip 1: SQL -->
    <g transform="translate(-250, 0)">
      <rect x="-42" y="-12" width="84" height="24" rx="6" fill="#081e28" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.35"/>
      <text y="4" class="text-mono" font-size="11" fill="#f5f8f7" font-weight="600">SQL</text>
    </g>
    <!-- Chip 2: Python -->
    <g transform="translate(-150, 0)">
      <rect x="-48" y="-12" width="96" height="24" rx="6" fill="#081e28" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.35"/>
      <text y="4" class="text-mono" font-size="11" fill="#f5f8f7" font-weight="600">Python</text>
    </g>
    <!-- Chip 3: Data Analysis -->
    <g transform="translate(-35, 0)">
      <rect x="-56" y="-12" width="112" height="24" rx="6" fill="#081e28" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.45"/>
      <text y="4" class="text-mono" font-size="11" fill="#38bdf8" font-weight="600">Data Analytics</text>
    </g>
    <!-- Chip 4: Next.js / Node -->
    <g transform="translate(85, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="6" fill="#081e28" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.35"/>
      <text y="4" class="text-mono" font-size="11" fill="#f5f8f7" font-weight="600">Next.js 15</text>
    </g>
    <!-- Chip 5: Astroinformatics -->
    <g transform="translate(215, 0)">
      <rect x="-66" y="-12" width="132" height="24" rx="6" fill="#081e28" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.45"/>
      <text y="4" class="text-mono" font-size="11" fill="#dfc790" font-weight="600">Astroinformatics</text>
    </g>
  </g>

  <!-- Coordinates Metadata Footer Line inside Hero -->
  <g transform="translate(470, 328)" text-anchor="middle">
    <text class="text-mono" font-size="9.5" fill="#4f6e67" letter-spacing="1">
      LAT 29.98°N LON 31.21°E  //  #ROADTO200K  //  VOLLEYBALL ATHLETE #21  //  OPEN DOORS SCHOLAR
    </text>
  </g>
</svg>
