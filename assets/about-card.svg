<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="auto">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="colBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e28" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    .star { animation: tw 4s ease-in-out infinite alternate; }
    .star-del { animation: tw 5s ease-in-out 2s infinite alternate; }
    @keyframes tw { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 0.9; transform: scale(1.2); } }
  </style>

  <!-- Base Card -->
  <rect x="4" y="4" width="932" height="312" rx="16" fill="url(#abBg)" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <rect x="8" y="8" width="924" height="304" rx="12" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="6 6"/>

  <!-- Stars -->
  <circle cx="80" cy="45" r="1.2" fill="#dfc790" class="star"/>
  <circle cx="450" cy="28" r="1" fill="#38bdf8" class="star-del"/>
  <circle cx="880" cy="50" r="1.2" fill="#dfc790" class="star"/>
  <circle cx="220" cy="290" r="1" fill="#38bdf8" class="star"/>
  <circle cx="750" cy="285" r="1.2" fill="#dfc790" class="star-del"/>

  <!-- Corner Reticles -->
  <path d="M 14 26 L 14 14 L 26 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 26 L 926 14 L 914 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 14 294 L 14 306 L 26 306" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 294 L 926 306 L 914 306" stroke="#c5a059" stroke-width="1.5" fill="none"/>

  <!-- Header Badge & Title -->
  <g transform="translate(35, 24)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#05141c" stroke="#c5a059" stroke-width="1"/>
    <text x="110" y="16" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ 01 // MISSION &amp; VISION</text>
    
    <text x="240" y="17" fill="#f5f8f7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">Hussein ElBassiouni <tspan fill="#64748b" font-size="13" font-weight="400">· حسين البسيوني ·</tspan> <tspan fill="#38bdf8" font-size="13" font-weight="600">Applied Informatics 09.03.03</tspan></text>
  </g>

  <!-- 3 Pillars Grid -->
  <!-- Pillar 1: Astroinformatics -->
  <g transform="translate(35, 68)">
    <rect x="0" y="0" width="275" height="224" rx="12" fill="url(#colBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="16" y="16" width="130" height="22" rx="11" fill="#030a0e" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="81" y="31" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">🔭 THE NORTH STAR</text>

    <text x="16" y="64" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Astroinformatics</text>
    <text x="16" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Data Science for Astronomy</text>

    <text x="16" y="112" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Applying deep learning &amp; high-</tspan>
      <tspan x="16" dy="17">performance CUDA pipelines to</tspan>
      <tspan x="16" dy="17">process multi-wavelength telescope</tspan>
      <tspan x="16" dy="17">surveys (FITS), photometric</tspan>
      <tspan x="16" dy="17">curves &amp; planetary telemetry.</tspan>
    </text>

    <line x1="16" y1="194" x2="259" y2="194" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="16" y="211" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">TARGET: NASA / OBSERVATORIES</text>
  </g>

  <!-- Pillar 2: #RoadTo200K -->
  <g transform="translate(332, 68)">
    <rect x="0" y="0" width="275" height="224" rx="12" fill="url(#colBg)" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.45"/>
    <rect x="16" y="16" width="132" height="22" rx="11" fill="#030a0e" stroke="#c5a059" stroke-width="0.8"/>
    <text x="82" y="31" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">💰 #ROADTO200K</text>

    <text x="16" y="64" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Build In Public</text>
    <text x="16" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Self-Funded Russian Journey</text>

    <text x="16" y="112" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Self-funding 200,000 EGP for</tspan>
      <tspan x="16" dy="17">travel preparations, student arrival,</tspan>
      <tspan x="16" dy="17">&amp; heavy CUDA workstation via</tspan>
      <tspan x="16" dy="17">freelance data analysis, SQL/Python</tspan>
      <tspan x="16" dy="17">services &amp; full-stack systems.</tspan>
    </text>

    <line x1="16" y1="194" x2="259" y2="194" stroke="#c5a059" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="16" y="211" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">HONOR, MERIT &amp; SELF-RELIANCE</text>
  </g>

  <!-- Pillar 3: Athlete Mindset -->
  <g transform="translate(630, 68)">
    <rect x="0" y="0" width="275" height="224" rx="12" fill="url(#colBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="16" y="16" width="138" height="22" rx="11" fill="#030a0e" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="85" y="31" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">🏐 ATHLETE CREED</text>

    <text x="16" y="64" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Outside Hitter #21</text>
    <text x="16" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">188 cm · Tactical Outside Hitter</text>

    <text x="16" y="112" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Overcame unilateral vision injury</tspan>
      <tspan x="16" dy="17">to forge a tactical return to</tspan>
      <tspan x="16" dy="17">Position 4. 180-day conditioning</tspan>
      <tspan x="16" dy="17">program to claim Jersey #21 in</tspan>
      <tspan x="16" dy="17">Russian collegiate volleyball.</tspan>
    </text>

    <line x1="16" y1="194" x2="259" y2="194" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="16" y="211" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">PER ASPERA AD ASTRA ★</text>
  </g>
</svg>