<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="auto">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="colBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e28" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="932" height="292" rx="16" fill="url(#abBg)" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Corner Reticles -->
  <path d="M 14 26 L 14 14 L 26 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 26 L 926 14 L 914 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 14 274 L 14 286 L 26 286" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 274 L 926 286 L 914 286" stroke="#c5a059" stroke-width="1.5" fill="none"/>

  <!-- Header Section -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#05141c" stroke="#c5a059" stroke-width="1"/>
    <text x="90" y="17" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ MISSION &amp; VISION</text>
    
    <text x="198" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Hussein ElBassiouni <tspan fill="#38bdf8" font-size="14" font-weight="600">· Applied Informatics (09.03.03)</tspan></text>
  </g>

  <!-- 3 Big Spacious Pillars -->
  <!-- Pillar 1: Astroinformatics -->
  <g transform="translate(32, 68)">
    <rect x="0" y="0" width="278" height="206" rx="12" fill="url(#colBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    
    <text x="20" y="34" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">🔭 THE NORTH STAR</text>
    <text x="20" y="62" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Astroinformatics</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Data Science for Astronomy</text>

    <text x="20" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" line-height="1.5">
      <tspan x="20" dy="0">Processing telescope surveys,</tspan>
      <tspan x="20" dy="22">photometric transit curves &amp;</tspan>
      <tspan x="20" dy="22">planetary telemetry with AI.</tspan>
    </text>

    <text x="20" y="188" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">TARGET: NASA / OBSERVATORIES</text>
  </g>

  <!-- Pillar 2: #RoadTo200K -->
  <g transform="translate(331, 68)">
    <rect x="0" y="0" width="278" height="206" rx="12" fill="url(#colBg)" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.5"/>
    
    <text x="20" y="34" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">💰 #ROADTO200K</text>
    <text x="20" y="62" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Build In Public</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Self-Funded Russian Journey</text>

    <text x="20" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan x="20" dy="0">Self-funding 200K EGP via</tspan>
      <tspan x="20" dy="22">freelance SQL, Python pipelines,</tspan>
      <tspan x="20" dy="22">data analysis &amp; full-stack apps.</tspan>
    </text>

    <text x="20" y="188" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">HONOR &amp; INDEPENDENCE</text>
  </g>

  <!-- Pillar 3: Athlete Mindset -->
  <g transform="translate(630, 68)">
    <rect x="0" y="0" width="278" height="206" rx="12" fill="url(#colBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    
    <text x="20" y="34" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">🏐 ATHLETE CREED</text>
    <text x="20" y="62" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Outside Hitter #21</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Volleyball • 188 cm • Discipline</text>

    <text x="20" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan x="20" dy="0">Overcame eye injury to play</tspan>
      <tspan x="20" dy="22">Pos 4. 180-day regimen to wear</tspan>
      <tspan x="20" dy="22">#21 for university in Russia.</tspan>
    </text>

    <text x="20" y="188" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">PER ASPERA AD ASTRA ★</text>
  </g>
</svg>