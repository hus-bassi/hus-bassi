<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 90" width="100%" height="auto">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030a0e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#05141c" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#081e28" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#05141c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030a0e" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c5a059" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f5eedc" stop-opacity="1"/>
      <stop offset="65%" stop-color="#c5a059" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="940" height="90" rx="8" fill="url(#footerBg)"/>

  <!-- Divider Line -->
  <line x1="80" y1="20" x2="860" y2="20" stroke="url(#goldLine)" stroke-width="1.2"/>
  
  <!-- Central Star Pulse -->
  <g transform="translate(470, 20)">
    <circle cx="0" cy="0" r="3" fill="#dfc790"/>
    <polygon points="0,-6 2,0 0,6 -2,0" fill="#dfc790"/>
  </g>

  <!-- Quote -->
  <text x="470" y="48" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#dfc790" letter-spacing="1.5">
    “ЧЕРЕЗ ТЕРНИИ К ЗВЁЗДАМ • PER ASPERA AD ASTRA”
  </text>

  <!-- Baseline Subtitle -->
  <text x="470" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#849e97" letter-spacing="0.5">
    Hussein ElBassiouni • Data Analyst &amp; Future Astroinformatics Scholar • Cairo to Moscow 2026–2027
  </text>
</svg>
