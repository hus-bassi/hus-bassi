<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="auto">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Base Outer Card -->
  <rect x="4" y="4" width="932" height="362" rx="16" fill="url(#skBg)" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Corner Reticles -->
  <path d="M 14 26 L 14 14 L 26 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 26 L 926 14 L 914 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 14 344 L 14 356 L 26 356" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 344 L 926 356 L 914 356" stroke="#c5a059" stroke-width="1.5" fill="none"/>

  <!-- Header Badge & Title -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#05141c" stroke="#c5a059" stroke-width="1"/>
    <text x="90" y="17" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ TECHNICAL ARSENAL</text>
    
    <text x="198" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Core Competencies &amp; Production Stack</text>
  </g>

  <!-- 4 Spacious Quadrants - Completely Removed Cramped Inner Boxes -->
  <!-- Quad 1: Data Analytics & Relational Databases -->
  <g transform="translate(32, 68)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#c5a059" stroke-width="0.9" stroke-opacity="0.45"/>
    <text x="22" y="30" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">📊 Data Analytics &amp; Relational Databases</text>
    
    <text x="22" y="60" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#38bdf8" font-weight="700">✦ SQL:</tspan> PostgreSQL • MS SQL Server • Complex Queries &amp; Joins
    </text>

    <text x="22" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#dfc790" font-weight="700">✦ Python:</tspan> NumPy • Pandas • Data Cleaning &amp; Automation
    </text>

    <text x="22" y="110" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">
      <tspan fill="#38bdf8" font-weight="600">✦ Analytics:</tspan> Advanced Spreadsheets • DataCamp Associate Track
    </text>
  </g>

  <!-- Quad 2: Full-Stack Systems Engineering -->
  <g transform="translate(480, 68)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
    <text x="22" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">⚡ Full-Stack Systems Engineering</text>
    
    <text x="22" y="60" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#dfc790" font-weight="700">✦ Next.js 15:</tspan> App Router • Server Actions • High-Conversion UX
    </text>

    <text x="22" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#38bdf8" font-weight="700">✦ TypeScript &amp; Node.js:</tspan> Modern ES2024 • RESTful APIs &amp; Auth
    </text>

    <text x="22" y="110" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">
      <tspan fill="#dfc790" font-weight="600">✦ Production UI:</tspan> Tailwind CSS • Google Analytics 4 &amp; Meta CAPI
    </text>
  </g>

  <!-- Quad 3: Applied Science & Astroinformatics -->
  <g transform="translate(32, 212)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
    <text x="22" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">🔭 Applied Science &amp; Astroinformatics</text>
    
    <text x="22" y="60" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#38bdf8" font-weight="700">✦ Astroinformatics:</tspan> FITS Processing • Telescope Surveys • Photometry
    </text>

    <text x="22" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#dfc790" font-weight="700">✦ Machine Learning:</tspan> Recommendation Engines • Deep Learning
    </text>

    <text x="22" y="110" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">
      <tspan fill="#38bdf8" font-weight="600">✦ Scientific Methods:</tspan> A/B Testing • Numerical &amp; Relational Schemas
    </text>
  </g>

  <!-- Quad 4: Cloud, Tooling & Infrastructure -->
  <g transform="translate(480, 212)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#c5a059" stroke-width="0.9" stroke-opacity="0.45"/>
    <text x="22" y="30" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">☁️ Cloud, Tooling &amp; Infrastructure</text>
    
    <text x="22" y="60" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#dfc790" font-weight="700">✦ Version Control:</tspan> Git &amp; GitHub Semantic Branching &amp; Actions
    </text>

    <text x="22" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      <tspan fill="#38bdf8" font-weight="700">✦ Serverless Cloud:</tspan> Vercel Edge Functions • Production DNS
    </text>

    <text x="22" y="110" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">
      <tspan fill="#dfc790" font-weight="600">✦ Environments:</tspan> PowerShell • Bash • Linux CLI • Docker Basics
    </text>
  </g>
</svg>