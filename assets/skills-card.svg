<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="100%" height="auto">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="932" height="292" rx="16" fill="url(#skBg)" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Corner Reticles -->
  <path d="M 14 26 L 14 14 L 26 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 26 L 926 14 L 914 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 14 274 L 14 286 L 26 286" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 274 L 926 286 L 914 286" stroke="#c5a059" stroke-width="1.5" fill="none"/>

  <!-- Header Badge & Title -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#05141c" stroke="#c5a059" stroke-width="1"/>
    <text x="90" y="17" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ TECHNICAL ARSENAL</text>
    
    <text x="198" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Core Competencies &amp; Production Stack</text>
  </g>

  <!-- 4 Clean Spacious Quadrants -->
  <!-- Quad 1: Data Analytics -->
  <g transform="translate(32, 66)">
    <rect x="0" y="0" width="428" height="96" rx="10" fill="url(#boxBg)" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="18" y="28" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">📊 Data Analytics &amp; Relational Databases</text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="82" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SQL (Postgres / MS SQL)</text>

      <rect x="175" y="0" width="145" height="28" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.8"/>
      <text x="247" y="18" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Python (Pandas / NumPy)</text>
    </g>
    <text x="18" y="88" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">DataCamp Track • Advanced Spreadsheets • ETL Pipelines</text>
  </g>

  <!-- Quad 2: Full-Stack Systems -->
  <g transform="translate(480, 66)">
    <rect x="0" y="0" width="428" height="96" rx="10" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="18" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">⚡ Full-Stack Systems Engineering</text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.8"/>
      <text x="82" y="18" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Next.js 15 (App Router)</text>

      <rect x="175" y="0" width="145" height="28" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="247" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TypeScript &amp; Node.js</text>
    </g>
    <text x="18" y="88" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Tailwind CSS • RESTful APIs • Server Actions • GA4 / Meta CAPI</text>
  </g>

  <!-- Quad 3: Applied Science -->
  <g transform="translate(32, 176)">
    <rect x="0" y="0" width="428" height="96" rx="10" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="18" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">🔭 Applied Science &amp; Astroinformatics</text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="175" height="28" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="87" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Astroinformatics Pipelines</text>

      <rect x="185" y="0" width="160" height="28" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.8"/>
      <text x="265" y="18" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ML Recommendation</text>
    </g>
    <text x="18" y="88" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">FITS Processing • A/B Testing • Algorithmic Schema Design</text>
  </g>

  <!-- Quad 4: Infrastructure & Cloud -->
  <g transform="translate(480, 176)">
    <rect x="0" y="0" width="428" height="96" rx="10" fill="url(#boxBg)" stroke="#c5a059" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="18" y="28" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">☁️ Cloud, Tooling &amp; Infrastructure</text>
    
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.8"/>
      <text x="82" y="18" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Git &amp; GitHub Actions</text>

      <rect x="175" y="0" width="145" height="28" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="247" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Vercel Serverless</text>
    </g>
    <text x="18" y="88" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">PowerShell • Bash • Docker Basics • Production Monitoring</text>
  </g>
</svg>