<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="auto">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="932" height="362" rx="16" fill="url(#skBg)" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Corner Reticles -->
  <path d="M 14 26 L 14 14 L 26 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 26 L 926 14 L 914 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 14 344 L 14 356 L 26 356" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 344 L 926 356 L 914 356" stroke="#c5a059" stroke-width="1.5" fill="none"/>

  <!-- Header Badge & Title -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#05141c" stroke="#c5a059" stroke-width="1"/>
    <text x="90" y="17" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ TECHNICAL ARSENAL</text>
    
    <text x="198" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Core Competencies &amp; Production Stack</text>
  </g>

  <!-- 4 Spacious Quadrants (Height 130px each) -->
  <!-- Quad 1: Data Analytics & Relational Databases -->
  <g transform="translate(32, 68)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#c5a059" stroke-width="0.9" stroke-opacity="0.45"/>
    <text x="20" y="30" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">📊 Data Analytics &amp; Relational Databases</text>
    
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="175" height="32" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.9"/>
      <text x="87" y="20.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">SQL (Postgres / MS SQL)</text>

      <rect x="185" y="0" width="165" height="32" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.9"/>
      <text x="267" y="20.5" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Python (Pandas / NumPy)</text>
    </g>
    
    <text x="20" y="106" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">DataCamp Track • Advanced Spreadsheets • Complex Joins • ETL</text>
  </g>

  <!-- Quad 2: Full-Stack Systems Engineering -->
  <g transform="translate(480, 68)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">⚡ Full-Stack Systems Engineering</text>
    
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="175" height="32" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.9"/>
      <text x="87" y="20.5" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Next.js 15 (App Router)</text>

      <rect x="185" y="0" width="165" height="32" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.9"/>
      <text x="267" y="20.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">TypeScript &amp; Node.js</text>
    </g>
    
    <text x="20" y="106" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">Tailwind CSS • REST APIs • Server Actions • GA4 &amp; Meta CAPI</text>
  </g>

  <!-- Quad 3: Applied Science & Astroinformatics -->
  <g transform="translate(32, 212)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">🔭 Applied Science &amp; Astroinformatics</text>
    
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="185" height="32" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.9"/>
      <text x="92" y="20.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Astroinformatics Pipelines</text>

      <rect x="195" y="0" width="165" height="32" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.9"/>
      <text x="277" y="20.5" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">ML Recommendation</text>
    </g>
    
    <text x="20" y="106" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">FITS Telescope Processing • A/B Testing • Algorithmic Modeling</text>
  </g>

  <!-- Quad 4: Cloud, Tooling & Infrastructure -->
  <g transform="translate(480, 212)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#boxBg)" stroke="#c5a059" stroke-width="0.9" stroke-opacity="0.45"/>
    <text x="20" y="30" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">☁️ Cloud, Tooling &amp; Infrastructure</text>
    
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="175" height="32" rx="6" fill="#05141c" stroke="#dfc790" stroke-width="0.9"/>
      <text x="87" y="20.5" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Git &amp; GitHub Actions</text>

      <rect x="185" y="0" width="165" height="32" rx="6" fill="#05141c" stroke="#38bdf8" stroke-width="0.9"/>
      <text x="267" y="20.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Vercel Serverless</text>
    </g>
    
    <text x="20" y="106" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400">PowerShell • Bash • Docker Basics • Production Telemetry</text>
  </g>
</svg>