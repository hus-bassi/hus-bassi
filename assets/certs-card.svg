    <text x="18" y="26" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ HACKERRANK VERIFIED</text>

    <text x="18" y="54" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✦ Python (Basic) <tspan fill="#94a3b8" font-size="12">·</tspan> SQL (Basic) <tspan fill="#94a3b8" font-size="12">·</tspan> Node.js (Basic)</text>
    <text x="18" y="80" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Official Problem Solving &amp; Algorithmic Competencies</text>
  </g>

  <!-- Block 3: Russian Ministerial Honors -->
  <g transform="translate(32, 174)">
