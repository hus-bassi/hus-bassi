<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="auto">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a0e"/>
      <stop offset="50%" stop-color="#05141c"/>
      <stop offset="100%" stop-color="#081e28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c734b"/>
      <stop offset="35%" stop-color="#dfc790"/>
      <stop offset="70%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="blockBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081e28" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="932" height="362" rx="16" fill="url(#crBg)" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Corner Reticles -->
  <path d="M 14 26 L 14 14 L 26 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 26 L 926 14 L 914 14" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 14 344 L 14 356 L 26 356" stroke="#c5a059" stroke-width="1.5" fill="none"/>
  <path d="M 926 344 L 926 356 L 914 356" stroke="#c5a059" stroke-width="1.5" fill="none"/>

  <!-- Header Badge & Title -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#05141c" stroke="#c5a059" stroke-width="1"/>
    <text x="90" y="17" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">✦ ACCREDITATIONS</text>
    
    <text x="198" y="18" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">11 Verified Industry &amp; Ministerial Honors <tspan fill="#38bdf8" font-size="13" font-weight="600">· 100% Verifiable</tspan></text>
  </g>

  <!-- 4 Spacious Blocks (Height 130px each) -->
  <!-- Block 1: DataCamp -->
  <g transform="translate(32, 68)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#blockBg)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">📊 DATACAMP CERTIFIED</text>
    
    <text x="20" y="66" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">✦ Introduction to SQL <tspan fill="#f8fafc" font-size="13" font-weight="400">(ID: #50,679,615)</tspan></text>
    <text x="20" y="98" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">✦ Spreadsheet Fundamentals <tspan fill="#f8fafc" font-size="13" font-weight="400">(15-Hour Skill Track)</tspan></text>
  </g>

  <!-- Block 2: HackerRank -->
  <g transform="translate(480, 68)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#blockBg)" stroke="#c5a059" stroke-width="0.9" stroke-opacity="0.45"/>
    <text x="20" y="30" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">⚡ HACKERRANK CERTIFIED</text>

    <text x="20" y="66" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700">✦ Python (Basic) <tspan fill="#94a3b8">·</tspan> SQL (Basic) <tspan fill="#94a3b8">·</tspan> Node.js (Basic)</text>
    <text x="20" y="98" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13">Official Problem Solving &amp; Algorithmic Competencies</text>
  </g>

  <!-- Block 3: Russian Ministerial Honors -->
  <g transform="translate(32, 212)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#blockBg)" stroke="#c5a059" stroke-width="0.9" stroke-opacity="0.45"/>
    <text x="20" y="30" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">🇷🇺 RUSSIAN MINISTERIAL HONORS (УРОК ЦИФРЫ)</text>

    <text x="20" y="66" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">✦ Data Analysis &amp; Algorithms <tspan fill="#dfc790">(Avito &amp; Sberbank Honors)</tspan></text>
    <text x="20" y="98" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">✦ Autonomous AI Agents &amp; 3D Tech <tspan fill="#38bdf8">(ANO CE &amp; Sber)</tspan></text>
  </g>

  <!-- Block 4: Central Bank & UN -->
  <g transform="translate(480, 212)">
    <rect x="0" y="0" width="428" height="130" rx="12" fill="url(#blockBg)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">🏛️ CENTRAL BANK &amp; UNITED NATIONS</text>

    <text x="20" y="66" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">✦ Central Bank of Russia: <tspan fill="#dfc790">Advanced Financial Exam</tspan></text>
    <text x="20" y="98" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">✦ UNICEF / UN Agora: <tspan fill="#38bdf8">PSEA International Ethics (1113483437HE)</tspan></text>
  </g>
