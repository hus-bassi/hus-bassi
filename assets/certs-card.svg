    <text x="18" y="26" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">🇷🇺 RUSSIAN MINISTERIAL HONORS (УРОК ЦИФРЫ)</text>

    <text x="18" y="54" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✦ Data Analysis &amp; Algorithms <tspan fill="#dfc790">(Avito &amp; Sberbank Honors)</tspan></text>
    <text x="18" y="78" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✦ Autonomous AI Agents &amp; 3D Tech <tspan fill="#38bdf8">(ANO CE &amp; Sber)</tspan></text>
  </g>

  <!-- Block 4: Central Bank & UN -->
  <g transform="translate(480, 174)">
    <rect x="0" y="0" width="428" height="96" rx="10" fill="url(#blockBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">🏛️ CENTRAL BANK &amp; UNITED NATIONS</text>

    <text x="18" y="54" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✦ Central Bank of Russia: <tspan fill="#dfc790">Advanced Financial Exam</tspan></text>
    <text x="18" y="78" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✦ UNICEF / UN Agora: <tspan fill="#38bdf8">PSEA International Ethics (1113483437HE)</tspan></text>
