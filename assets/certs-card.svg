  <g transform="translate(32, 66)">
    <rect x="0" y="0" width="428" height="96" rx="10" fill="url(#blockBg)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">📊 DATACAMP CERTIFIED</text>
    
    <text x="18" y="54" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✦ Introduction to SQL <tspan fill="#f1f5f9" font-size="12" font-weight="400">(ID: #50,679,615)</tspan></text>
    <text x="18" y="80" fill="#dfc790" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">✦ Spreadsheet Fundamentals <tspan fill="#f1f5f9" font-size="12" font-weight="400">(15-Hour Track)</tspan></text>
  </g>

  <!-- Block 2: HackerRank -->
  <g transform="translate(480, 66)">
